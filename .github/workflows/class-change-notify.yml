name: Class cancel/reschedule notifications

# Fires once the generator has published a new timetable.
#
# This used to be `on: push` filtered to db/timetables/*.json, which worked
# while a regenerated timetable arrived as a commit. Timetables now go straight
# to MongoDB and never touch the repo, so that trigger could never fire again -
# chaining off the generator's own run is what replaces it.
#
# The hourly schedule is a safety net: it catches a timetable written by
# anything other than that workflow (a manual run of the generator, or the
# Gmail sync), and a run with nothing new to say sends nothing.
on:
  workflow_run:
    workflows: ["Generate timetables"]
    types: [completed]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Every step below needs the database connection: MongoDB is the only store, so
# without it the sync jobs have nowhere to put what they parse and the push
# senders have nothing to read. Jobs fail loudly rather than quietly doing
# nothing if it is missing.
env:
  MONGODB_URI: ${{ secrets.MONGODB_URI }}
  MONGODB_DB: compiler2


jobs:
  notify:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: notification-delivery-and-audit
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in MONGODB_URI MONGODB_DB VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required secret: $name"
              exit 1
            fi
          done

      - name: Send class cancel/reschedule push notifications
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: mailto:compilersociety@gmail.com
        run: |
          npm ci --silent
          set +e
          node scripts/notifications/send-class-push.mjs
          status=$?
          set -e
          if [ -f notifylog.jsonl ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git pull --rebase origin main
            git add notifylog.jsonl
            git diff --cached --quiet || git commit -m "audit: record notification deliveries"
            git push origin HEAD:main
          fi
          if [ "$status" -eq 10 ]; then
            echo "Notification sender completed with no work."
            exit 0
          fi
          exit "$status"

      # notifylog.jsonl is a temporary, explicit exception: successful sends
      # are committed above so delivery recipients can be audited.
