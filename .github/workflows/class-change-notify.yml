name: Class cancel/reschedule notifications

# Fires once the generator has published a new timetable.
#
# This used to be `on: push` filtered to db/timetables/*.json, which worked
# while a regenerated timetable arrived as a commit. Timetables now go straight
# to MongoDB and never touch the repo, so that trigger could never fire again -
# chaining off the generator's own run is what replaces it.
#
# The hourly schedule is a safety net: it catches a timetable written by
# anything other than that workflow (a manual run of the generator, or the
# Gmail sync), and a run with nothing new to say sends nothing.
on:
  workflow_run:
    workflows: ["Generate timetables"]
    types: [completed]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Every step below needs the database connection: MongoDB is the only store, so
# without it the sync jobs have nowhere to put what they parse and the push
# senders have nothing to read. Jobs fail loudly rather than quietly doing
# nothing if it is missing.
env:
  MONGODB_URI: ${{ secrets.MONGODB_URI }}
  MONGODB_DB: ${{ secrets.MONGODB_DB }}


jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Send class cancel/reschedule push notifications
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: mailto:compilersociety@gmail.com
        run: |
          npm ci --silent
          set +e
          node scripts/notifications/send-class-push.mjs
          status=$?
          set -e
          if [ "$status" -eq 10 ]; then
            echo "Notification sender completed with no work."
            exit 0
          fi
          exit "$status"

      # No commit step any more. This job used to write its results into db/
      # and push them; that data now lives in MongoDB, written directly by the
      # step above, so a run produces no repo changes at all. That was the point
      # of the migration: notifications and syncs stopped churning main.
