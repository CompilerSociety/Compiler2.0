name: Merge leaderboard data into main

# Arcade scores are written straight to the repo by api/leaderboard.js, one
# commit per personal best. Pointed at main that meant every score shipped a
# Vercel deployment and a history entry, which on a busy evening exhausts the
# daily deploy quota and drowns out real commits.
#
# So the API writes to the `leaderboard-data` branch instead (see the
# dataBranch() comment in api/leaderboard.js), and this job folds a day's worth
# of those commits into main as ONE merge every 24 hours. Players are unaffected
# in the meantime: the API also *reads* from that branch, so a score is visible
# the instant it is saved.
#
# After merging, the data branch is fast-forwarded back onto main so the two
# never drift far apart and the next merge stays trivial.

on:
  schedule:
    # 00:20 UTC = 05:20 PKT - the quietest hour for a student site, so the
    # single deployment this triggers lands when nobody is mid-run.
    - cron: "20 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Never let two merges interleave: both push main and rewrite the data branch.
concurrency:
  group: merge-leaderboard-data
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge the day's scores into main
        env:
          DATA_BRANCH: leaderboard-data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null 2>&1; then
            echo "$DATA_BRANCH does not exist yet - creating it from main."
            git push origin "refs/remotes/origin/main:refs/heads/$DATA_BRANCH"
            exit 0
          fi

          git fetch origin main "$DATA_BRANCH"
          DATA_SHA="$(git rev-parse "origin/$DATA_BRANCH")"

          if git merge-base --is-ancestor "$DATA_SHA" origin/main; then
            echo "No new scores since the last merge."
            exit 0
          fi

          # main is pushed to constantly by the other scheduled workflows, so a
          # push here can lose the race. Redo the whole merge on top of the
          # fresh main rather than trying to rebase a merge commit.
          merged=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B main origin/main

            # The data branch owns the leaderboard files: the API is their
            # only writer and always writes a whole file, so on the unexpected
            # chance main touched one too, the branch's copy wins rather than a
            # hand-resolved JSON conflict. A conflict anywhere ELSE is a real
            # surprise and fails the run.
            if ! git merge --no-edit -m "Merge the day's leaderboard scores into main" "$DATA_SHA"; then
              unmerged="$(git diff --name-only --diff-filter=U)"
              unexpected="$(echo "$unmerged" | grep -v -E "^(db/games/leaderboards/|db/metadata/rate-limit\.json$)" || true)"
              if [ -n "$unexpected" ]; then
                echo "::error::Conflicts outside the leaderboard data paths: $unexpected"
                git merge --abort
                exit 1
              fi
              for f in $unmerged; do
                git checkout --theirs -- "$f"
                git add "$f"
              done
              git commit --no-edit
            fi

            if git push origin main; then
              merged=1
              break
            fi
            echo "Push attempt $attempt failed (main moved), retrying..."
            sleep $((RANDOM % 8 + 3))
          done

          if [ "$merged" -ne 1 ]; then
            echo "::error::Could not push the leaderboard merge after 5 attempts"
            exit 1
          fi

          # Resync the data branch onto the merged main. --force-with-lease
          # aborts if a score landed while this job ran - that score is simply
          # picked up by tomorrow's merge, so a refusal here is not an error.
          if git push --force-with-lease="$DATA_BRANCH:$DATA_SHA" origin "main:$DATA_BRANCH"; then
            echo "$DATA_BRANCH resynced to main."
          else
            echo "$DATA_BRANCH moved during the run - leaving it; the next merge will catch up."
          fi
