name: Generate timetables

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Every step below needs the database connection: MongoDB is the only store, so
# without it the sync jobs have nowhere to put what they parse and the push
# senders have nothing to read. Jobs fail loudly rather than quietly doing
# nothing if it is missing.
env:
  MONGODB_URI: ${{ secrets.MONGODB_URI }}
  MONGODB_DB: compiler2


concurrency:
  group: generate-timetables
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore Google service-account credential
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "Missing required GOOGLE_SERVICE_ACCOUNT_JSON repository secret"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > service-account.json

      - name: Generate timetables
        run: python python/scripts/Script.py

      # No commit step any more. This job used to write its results into db/
      # and push them; that data now lives in MongoDB, written directly by the
      # step above, so a run produces no repo changes at all. That was the point
      # of the migration: notifications and syncs stopped churning main.
