name: Poll live Show Up Schedule sheet

# The school edits the Show Up Schedule directly in a Google Sheet - they
# don't resend a new email when it changes. So instead of waiting on email,
# this polls that live sheet every 5 minutes (GitHub's fastest reliable cron
# cadence) and re-syncs only if the content actually changed (the commit step
# below only pushes a real diff, so an unchanged sheet is a harmless no-op).
#
# The sheet's link is discovered automatically from the one show-up-schedule
# email's body by the OTHER workflow (sync-seating-plan.yml) and stored in
# db/showup/source.json - this workflow just polls whatever sheet
# is on record there. If that file doesn't exist yet, this run is a no-op.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Every step below needs the database connection: MongoDB is the only store, so
# without it the sync jobs have nowhere to put what they parse and the push
# senders have nothing to read. Jobs fail loudly rather than quietly doing
# nothing if it is missing.
env:
  MONGODB_URI: ${{ secrets.MONGODB_URI }}
  MONGODB_DB: ${{ secrets.MONGODB_DB }}


jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Poll live sheet
        run: python api/fetch-timetable.py --poll-showup

      # No commit step any more. This job used to write its results into db/
      # and push them; that data now lives in MongoDB, written directly by the
      # step above, so a run produces no repo changes at all. That was the point
      # of the migration: notifications and syncs stopped churning main.
