name: Import exam data file

on:
  push:
    branches: [main]
    paths:
      - '*.xlsx'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notification-delivery-and-audit
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Import the root exam schedule
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ vars.MONGODB_DB || 'compiler2' }}
          PUSH_AFTER: ${{ github.sha }}
        run: python python/import_committed_exams.py --write
