name: Sync exam schedule from Gmail

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notification-delivery-and-audit
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch exam schedule from CompilerSociety Gmail and save to MongoDB
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ vars.MONGODB_DB || 'compiler2' }}
          GMAIL_USER: compilersociety@gmail.com
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
        run: python python/schedule_sync.py --gmail --kind exams --write
