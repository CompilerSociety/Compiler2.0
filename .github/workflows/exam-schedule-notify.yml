name: Exam schedule notifications

# Runs right after the seating/exam/showup sync finishes. Using workflow_run
# (not push) so it still fires when the sync's github-actions commit updates the
# exam schedule — a bot push does not trigger `on: push` workflows.
on:
  workflow_run:
    workflows: ["Sync seating plan, exam schedule & show up schedule"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

# Every step below needs the database connection: MongoDB is the only store, so
# without it the sync jobs have nowhere to put what they parse and the push
# senders have nothing to read. Jobs fail loudly rather than quietly doing
# nothing if it is missing.
env:
  MONGODB_URI: ${{ secrets.MONGODB_URI }}
  MONGODB_DB: compiler2


jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: notification-delivery-and-audit
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Send exam-schedule push notifications
        # Notifies each subscribed user whose department + batch + section appear
        # in a newly arrived exam schedule. No-op without VAPID secrets / subs /
        # a new schedule.
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: mailto:compilersociety@gmail.com
        run: |
          npm ci --silent
          set +e
          node scripts/notifications/send-exam-push.mjs
          status=$?
          set -e
          if [ -f notifylog.jsonl ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git pull --rebase origin main
            git add notifylog.jsonl
            git diff --cached --quiet || git commit -m "audit: record notification deliveries"
            git push origin HEAD:main
          fi
          if [ "$status" -eq 10 ]; then
            echo "Notification sender completed with no work."
            exit 0
          fi
          exit "$status"

      # notifylog.jsonl is a temporary, explicit exception: successful sends
      # are committed above so delivery recipients can be audited.
