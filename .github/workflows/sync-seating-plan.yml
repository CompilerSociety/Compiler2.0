name: Sync seating plan, exam schedule & show up schedule

on:
  # Primary (fast) trigger: a Google Apps Script polls the mailbox every minute
  # and fires this via the GitHub API the moment a new "seating"/"schedule"/
  # "showup" email arrives — see docs/seating-gmail-trigger.gs for setup.
  #
  # SECURITY: this is a public repo, so anyone on the internet can POST a
  # repository_dispatch. The "Validate repository_dispatch trigger" step below
  # fails the run BEFORE any Gmail work unless the client_payload contains the
  # secret that matches the repo secret SYNC_DISPATCH_SECRET (set both in the
  # repo settings and in the Apps Script PropertiesService — see
  # docs/apps-script/seating-gmail-trigger.gs). Optionally set the repo secret
  # SYNC_DISPATCH_ALLOWED_SENDERS to a comma-separated allowlist of GitHub
  # logins and the sender is checked too. Until both secrets are configured the
  # dispatch trigger fails fast; the 30-min cron below still works.
  repository_dispatch:
    types: [new-seating-email]
  # Safety-net trigger: in case the Apps Script trigger is ever paused/removed,
  # still check every 30 min so nothing gets stuck for too long. A run with no
  # new email is a harmless no-op (no commit, no deploy).
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Validate repository_dispatch trigger
        # Only repository_dispatch can be forged on a public repo (schedule and
        # workflow_dispatch are trusted: cron is GitHub-controlled, manual
        # dispatch needs write access). Fail fast, before any Gmail/API work.
        if: github.event_name == 'repository_dispatch'
        env:
          CLIENT_SECRET: ${{ github.event.client_payload.secret }}
          EXPECTED_SECRET: ${{ secrets.SYNC_DISPATCH_SECRET }}
          ALLOWED_SENDERS: ${{ secrets.SYNC_DISPATCH_ALLOWED_SENDERS }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          if [ -z "$EXPECTED_SECRET" ]; then
            echo "::error::SYNC_DISPATCH_SECRET repo secret is not set — add it to the repo settings and to the Apps Script PropertiesService"
            exit 1
          fi
          if [ "$CLIENT_SECRET" != "$EXPECTED_SECRET" ]; then
            echo "::error::repository_dispatch payload secret mismatch — forged or misconfigured dispatch"
            exit 1
          fi
          if [ -n "$ALLOWED_SENDERS" ]; then
            found=0
            IFS=',' read -ra senders <<< "$ALLOWED_SENDERS"
            for login in "${senders[@]}"; do
              login="${login// /}"
              if [ "$login" = "$SENDER" ]; then
                found=1
              fi
            done
            if [ "$found" -ne 1 ]; then
              echo "::error::repository_dispatch sender '$SENDER' is not in SYNC_DISPATCH_ALLOWED_SENDERS"
              exit 1
            fi
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies (pdftotext)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync from Gmail (seating plan, exam schedule, or show up schedule)
        env:
          # Mailbox to read from (not sensitive).
          GMAIL_USER: compilersociety@gmail.com
          # 16-char Gmail App Password — add this as a repo secret named GMAIL_PASS.
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
        run: python api/fetch-timetable.py

      - name: Send seat-alert push notifications
        # Notifies each subscribed device whose NU ID appears in the seating plan
        # and whose seat details changed. No-op if there are no subscriptions or
        # no changes. Requires VAPID_* repo secrets; skips itself if unset.
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: mailto:compilersociety@gmail.com
        run: |
          npm ci --silent
          node scripts/notifications/send-seating-push.mjs

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Add each output only if it exists - some appear only once their
          # feature has synced at least once (e.g. showup-sheet-source.json is
          # created only after a show-up email's sheet link is discovered), and
          # a plain "git add" of a missing path aborts the whole step.
          for f in db/seating/plan.json db/exams/*.json db/showup/*.json db/showup/source.json db/metadata/notifications/push-subscriptions.json db/metadata/notifications/push-state.json; do
            [ -e "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Sync seating plan / exam schedule / show up schedule from Gmail"
          # This workflow can be triggered concurrently (Apps Script dispatch +
          # the 30-min schedule + poll-showup-sheet.yml all write to db/),
          # so a push can race and get rejected as non-fast-forward. Retry with
          # a rebase onto the latest remote each time instead of failing the run.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed, retrying..."
            sleep $((RANDOM % 8 + 3))
          done
          echo "Push failed after 5 attempts"
          exit 1
