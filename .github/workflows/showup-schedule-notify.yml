name: Show-up schedule change notifications

# Runs after the show-up schedule may have changed. The poll workflow re-syncs
# the live sheet (and commits only real diffs); this then diffs section slots and
# notifies affected users of a new time/venue. workflow_run is used so the poll's
# github-actions commit still triggers it (a bot push doesn't fire `on: push`).
on:
  workflow_run:
    workflows:
      - "Poll live Show Up Schedule sheet"
      - "Sync seating plan, exam schedule & show up schedule"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

# Every step below needs the database connection: MongoDB is the only store, so
# without it the sync jobs have nowhere to put what they parse and the push
# senders have nothing to read. Jobs fail loudly rather than quietly doing
# nothing if it is missing.
env:
  MONGODB_URI: ${{ secrets.MONGODB_URI }}
  MONGODB_DB: compiler2


jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Send show-up change push notifications
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: mailto:compilersociety@gmail.com
        run: |
          npm ci --silent
          set +e
          node scripts/notifications/send-showup-push.mjs
          status=$?
          set -e
          if [ "$status" -eq 10 ]; then
            echo "Notification sender completed with no work."
            exit 0
          fi
          exit "$status"

      # No commit step any more. This job used to write its results into db/
      # and push them; that data now lives in MongoDB, written directly by the
      # step above, so a run produces no repo changes at all. That was the point
      # of the migration: notifications and syncs stopped churning main.
