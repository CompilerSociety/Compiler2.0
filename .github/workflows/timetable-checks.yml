name: Timetable regression checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s python/generate_timetable -t .
      - run: python -m unittest discover -s python -p 'test_schedule_sync.py'
      - run: python -m unittest discover -s python -p 'test_seating_rooms.py'
