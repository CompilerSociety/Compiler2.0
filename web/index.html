<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>V Table FAST NUCES Islamabad</title>
  <meta
    name="description"
    content="Generate your FAST NUCES Islamabad Fall 2026 timetable by degree, batch, section and courses. Supports CS, AI, DS, Cyber Security, Software Engineering and more."
>
<link
    rel="canonical"
     href="https://www.vtable.site/"
>			
  <meta name="google-site-verification" content="4cF36AgWjHe545KHBeQCSVQ8Wx4WS71_-GOyQbtsVck" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- "default" = opaque white bar with dark glyphs, matching the app's white
       scheme. "black-translucent" put the clock and battery in WHITE over the
       page, which is invisible against this background. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="V Table">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <!-- ASSET_VERSION below must be bumped on every deploy that changes any
       file under /css or /js. Browsers (especially installed PWAs, which
       revalidate far less eagerly than a normal tab) otherwise keep serving
       an old cached bundle indefinitely, silently masking bug fixes. -->
  <link rel="stylesheet" href="/css/main.css?v=11">
  <!-- Phone layout. Additive: everything inside is scoped to the mobile
       breakpoint, so the desktop look is unchanged. See css/mobile.css. -->
  <link rel="stylesheet" href="/css/mobile.css?v=11">
  <!-- Launch switch. Plain script so it runs before the deferred /js/main.js
       module and can gate the whole app. See js/status.js. -->
  <script src="/js/status.js?v=11"></script>
  <script>
    (function () {
      try {
        var path = location.pathname.replace(/\/+$/, '').replace(/^\/+/, '');
        var routes = {
          timetable: 'timetable',
          freerooms: 'freerooms',
          showup: 'showup',
          exams: 'exams',
          seating: 'seating',
          faculty: 'faculty'
        };
        if (routes[path] && location.hash !== '#' + routes[path]) {
          location.replace('/#' + routes[path]);
        }
      } catch (e) {}
    })();
  </script>
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app"><canvas id="bg3d" aria-hidden="true"></canvas><div id="modal-container"></div>
    <div class="shell"><div id="navbar-container"></div>
      <main class="content" id="main-content" role="main"><div id="content-container"></div></main>
      <div id="footer-container"></div>
    </div>
    <div id="mobile-container"></div>
  </div>
  <script type="module" src="/js/main.js?v=11"></script>
</body>
</html>
