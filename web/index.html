<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>V Table FAST NUCES Islamabad</title>
  <meta
    name="description"
    content="Generate your FAST NUCES Islamabad Fall 2026 timetable by degree, batch, section and courses. Supports CS, AI, DS, Cyber Security, Software Engineering and more."
>
<link
    rel="canonical"
     href="https://www.vtable.site/"
>			
  <meta name="google-site-verification" content="4cF36AgWjHe545KHBeQCSVQ8Wx4WS71_-GOyQbtsVck" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0a7a3a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="V Table">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/main.css">
  <script>
    (function () {
      try {
        var path = location.pathname.replace(/\/+$/, '').replace(/^\/+/, '');
        var routes = {
          timetable: 'timetable',
          freerooms: 'freerooms',
          showup: 'showup',
          exams: 'exams',
          seating: 'seating',
          faculty: 'faculty'
        };
        if (routes[path] && location.hash !== '#' + routes[path]) {
          location.replace('/#' + routes[path]);
        }
      } catch (e) {}
    })();
  </script>
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app"><canvas id="bg3d" aria-hidden="true"></canvas><div id="modal-container"></div>
    <div class="shell"><div id="navbar-container"></div>
      <main class="content" id="main-content" role="main"><div id="content-container"></div></main>
      <div id="footer-container"></div>
    </div>
  </div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
